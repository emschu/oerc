# db settings
DbType: sqlite
DbHost: oerc_db.sqlite
DbPort:
DbName: oer_server_dev
DbSchema:
DbUser:
DbPassword:
DbSSLEnabled: false
# general fetch settings
Debug: true
ProfilingEnabled: false
ForceUpdate: false
TimeToRefreshInMinutes: 360
DaysInPast: 2
DaysInFuture: 2
EnableARD: true
EnableZDF: true
EnableORF: true
EnableSRF: true
EnableProgramEntryCollection: true
EnableTVShowCollection: true
ProxyUrl:
TimeZone: Europe/Berlin
# backend server settings
ServerHost: 127.0.0.1
ServerPort: 8080
# client server settings
ClientEnabled: true
# search settings
SearchDaysInFuture: 5
SearchKeywords:
  - Loriot
  - Garten
SearchSkipChannels:
  - KIKA
  - ORF Sport +
AccessControlAllowOrigin: "http://127.0.0.1:8080"
# optional list of proxy ip addresses or cidr ranges whose X-Forwarded-For header
# is trusted for the client ip detection of the webserver, e.g. of a reverse proxy
#TrustedProxies:
#  - 127.0.0.1
#  - 10.0.0.0/8