name: OERC - Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Build Artifacts
        run: make release
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp ./bin/windows/oerc.exe ./release-assets/oerc.exe
          cp ./bin/linux-amd64/oerc ./release-assets/oerc-amd64
          cp ./bin/linux-386/oerc ./release-assets/oerc-386
          cp ./bin/linux-arm/oerc ./release-assets/oerc-arm
          cp ./bin/linux-arm64/oerc ./release-assets/oerc-arm64
          cp ./bin/linux-armv7/oerc ./release-assets/oerc-armv7
          cp ./bin/osx-arm64/oerc ./release-assets/oerc-darwin-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.github_release.outputs.changelog }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
